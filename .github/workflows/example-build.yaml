name: Example build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    working-directory: examples

jobs:
  count-commits:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Compute version from commit count
        id: tag
        shell: bash
        run: echo "version=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  image-build:
    needs: [count-commits]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: grpc-server
          - target: http-server
          - target: job
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: earthly/actions-setup@43211c7a0eae5344d6d79fb4aaf209c8f8866203 # v1.0.13
      - run: earthly +${{ matrix.target }} --TAG=${{ needs.count-commits.outputs.version }}
