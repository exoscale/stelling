---
name: Run an earthly target

on:
  workflow_call:
    inputs:
      target:
        description: 'Earthly target'
        required: false
        type: string
        default: +ci

jobs:
  earthly:
    name: earthly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/earthly-action
        with:
          target: ${{ inputs.target }}
